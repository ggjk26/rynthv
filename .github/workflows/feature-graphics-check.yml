name: Feature UI graphics compile check

on:
  push:
    branches:
      - feat/editor-playback-export-polish
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-graphics-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Linux x64 typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev libvulkan-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check GUI and synthesis binaries
        run: cargo check --locked --bins
      - name: Test Flat NOFS parser and synthesis preflight
        run: "cargo test --locked --lib flat::"
